version: "4.1"
name: CubeMx_demo_ETRClock1Mode
type: ARM
deviceName: null
packDir: null
srcDirs:
  - HAL
virtualFolder:
  name: <virtual_root>
  files:
    - path: .clang-format
    - path: .gitignore
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: db25e0cee7a78d64eb5084a45638e80d
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F103xB
      incList:
        - HAL/Core/Inc
        - HAL/Drivers/STM32F1xx_HAL_Driver/Inc
        - HAL/Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - HAL/Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - HAL/Drivers/CMSIS/Include
      libList: []
    excludeList:
      - Src/Drivers/CMSIS/DSP/DSP_Lib_TestSuite
      - Src/Drivers/CMSIS/DSP
      - Src/Drivers/CMSIS/NN
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: ""
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: HAL\STM32F103xx_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: stm32f1x
    uploader: OpenOCD
